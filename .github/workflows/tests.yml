name: Tests
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
      - name: Verify running two-table API
        run: |
          .venv/bin/python -m backend.demo --port 8780 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8780/health > /dev/null; then break; fi
            sleep 1
          done
          .venv/bin/python scripts/verify_backend.py --base-url http://127.0.0.1:8780 --allow-writes
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  swift-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
